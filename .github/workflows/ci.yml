name: CI/CD Pipeline

on:
push:
branches:
- main

pull_request:
branches:
- main

jobs:
backend-test:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: backend/package-lock.json

  - name: Install dependencies
    working-directory: backend
    run: npm install

  - name: Run tests
    working-directory: backend
    run: npm test
```

frontend-build:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: frontend/package-lock.json

  - name: Install dependencies
    working-directory: frontend
    run: npm install

  - name: Build frontend
    working-directory: frontend
    run: npm run build
```

docker-build:
needs:
- backend-test
- frontend-build

```
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - name: Build backend image
    run: docker build -t clothing-backend:ci ./backend

  - name: Build frontend image
    run: docker build -t clothing-frontend:ci ./frontend
```

deploy:
needs: docker-build

```
if: github.ref == 'refs/heads/main'

runs-on: ubuntu-latest

steps:
  - name: Verify Secrets
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    run: |
      echo "HOST length: ${#SSH_HOST}"
      echo "USER length: ${#SSH_USER}"

      if [ -z "$SSH_HOST" ]; then
        echo "SSH_HOST secret is missing"
        exit 1
      fi

      if [ -z "$SSH_USER" ]; then
        echo "SSH_USER secret is missing"
        exit 1
      fi

      if [ -z "$SSH_KEY" ]; then
        echo "SSH_KEY secret is missing"
        exit 1
      fi

  - name: Deploy over SSH
    uses: appleboy/ssh-action@v1.2.0
    with:
      host: ${{ secrets.SSH_HOST }}
      username: ${{ secrets.SSH_USER }}
      key: ${{ secrets.SSH_KEY }}
      port: 22
      command_timeout: 20m

      script: |
        set -e

        cd /home/ubuntu/crm-ecommerce

        git fetch origin main
        git reset --hard origin/main

        docker compose build
        docker compose up -d

        docker image prune -f
```
